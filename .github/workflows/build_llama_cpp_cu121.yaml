name: Build llama.cpp (Windows Docker + CUDA)

on:
  workflow_dispatch:

jobs:
  windows-cuda-docker:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Dockerfile for Windows CUDA build
        run: |
          cat > Dockerfile.windows_cuda <<'EOF'
          # Use official Windows Server Core image with Visual Studio Build Tools
          FROM mcr.microsoft.com/windows/servercore:ltsc2022

          # Install Chocolatey for package management
          RUN powershell -Command "Set-ExecutionPolicy Bypass -Scope Process -Force; \
                                   [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; \
                                   iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))"

          # Install Python, CMake, Ninja, Git, and CUDA toolkit via Chocolatey
          RUN choco install -y python cmake ninja git visualstudio2019buildtools visualstudio2022buildtools \
              visualstudio2019-workload-vctools visualstudio2022-workload-vctools --limit-output

          # Install CUDA 12.1 (network installer)
          RUN choco install -y cuda --version=12.1.105 --limit-output

          # Add paths for CUDA and Python
          ENV PATH="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.1/bin;C:/Python310/Scripts;C:/Python310;${PATH}"

          # Create a non-admin user for builds
          RUN net user builder Password123! /add && net localgroup Administrators builder /add
          USER builder
          WORKDIR C:/work
          EOF

      - name: Build Docker image (Windows + CUDA)
        run: docker build -t windows-cuda-builder:12.1 -f Dockerfile.windows_cuda .

      - name: Run Docker container and build llama.cpp
        env:
          LLAMA_ROOT: /work
        run: |
          docker run --rm -v "${{ github.workspace }}":C:/work -w C:/work windows-cuda-builder:12.1 powershell -Command "
            # Find CMakeLists.txt
            \$cmakeFile = Get-ChildItem -Path C:/work -Recurse -Filter CMakeLists.txt -File | Select-Object -First 1
            if (-not \$cmakeFile) { Write-Error 'CMakeLists.txt not found'; exit 1 }
            \$sourceDir = \$cmakeFile.Directory.FullName
            Write-Host 'Source directory:' \$sourceDir

            # Create build dir
            if (-not (Test-Path build)) { New-Item -ItemType Directory -Path build | Out-Null }
            Push-Location build

            # Configure CMake
            cmake -G Ninja -S \$sourceDir -B . -DLLAMA_BUILD_SHARED_LIBS=ON -DLLAMA_CUDA=ON -DCMAKE_BUILD_TYPE=Release

            # Build
            cmake --build . --config Release -- -j\$env:NUMBER_OF_PROCESSORS

            # Copy artifacts
            if (-not (Test-Path C:/work/artifact_llama_windows)) { New-Item -ItemType Directory -Path C:/work/artifact_llama_windows | Out-Null }
            \$dll = Get-ChildItem -Path . -Recurse -Filter 'llama.dll' -File | Select-Object -First 1
            \$lib = Get-ChildItem -Path . -Recurse -Filter 'llama.lib' -File | Select-Object -First 1
            if (\$dll) { Copy-Item \$dll.FullName -Destination C:/work/artifact_llama_windows/ -Force }
            if (\$lib) { Copy-Item \$lib.FullName -Destination C:/work/artifact_llama_windows/ -Force }

            Pop-Location
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda121
          path: artifact_llama_windows/**
