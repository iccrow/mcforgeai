name: Build llama.cpp (Windows, CUDA 12.1)

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Create source folder and clone llama.cpp
        shell: pwsh
        run: |
          mkdir src
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git src/llama.cpp

      - name: Setup venv + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip cmake ninja

      - name: MSVC dev env (v142 / 14.29)
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.29.30133

      - name: Setup CUDA 12.1 (network)
        uses: Jimver/cuda-toolkit@v0.2.29
        id: cuda
        with:
          cuda: '12.1.1'
          method: 'network'

      - name: Add CUDA to PATH + verify
        shell: pwsh
        run: |
          "$('${{ steps.cuda.outputs.CUDA_PATH }}')\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe" --version

      - name: Build llama.cpp (Release, shared lib)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Ninja"
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
          CMAKE_CUDA_COMPILER: "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe"
          CUDACXX: "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe"
          CMAKE_CUDA_HOST_COMPILER: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.29.30133/bin/Hostx64/x64/cl.exe"
        run: |
          if (-Not (Test-Path -Path build)) { New-Item -ItemType Directory -Path build | Out-Null }
          Push-Location build

          $sourceDir = Join-Path $PWD "..\\src\\llama.cpp"

          cmake -G "Ninja" -S "$sourceDir" -B . `
            -DLLAMA_BUILD_SHARED_LIBS=ON `
            -DLLAMA_CUDA=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_COMPILER="$($env:CMAKE_CUDA_COMPILER)" `
            -DCUDACXX="$($env:CUDACXX)" `
            -DCMAKE_CUDA_HOST_COMPILER="$($env:CMAKE_CUDA_HOST_COMPILER)"

          $nproc = $env:NUMBER_OF_PROCESSORS
          if (-not $nproc) { $nproc = 2 }
          cmake --build . --config Release -- -j $nproc

          Pop-Location

      - name: Collect artifacts (Windows)
        shell: pwsh
        run: |
          # ensure artifact dir exists
          $out = "artifact_llama_windows"
          if (-Not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }

          Write-Host "=== Built DLLs / LIBs (searching build/) ==="
          # Show all dll/lib/pdb in build tree so we can debug what was produced
          Get-ChildItem -Path build -Recurse -Include "*.dll","*.lib","*.pdb" -File | Sort-Object FullName | ForEach-Object {
            Write-Host $_.FullName
          }

          # copy llama-related artifacts
          Get-ChildItem -Path build -Recurse -Filter "llama.dll" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Copying $($_.FullName) -> $out"
            Copy-Item $_.FullName -Destination $out -Force
          }
          Get-ChildItem -Path build -Recurse -Filter "llama.lib" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $out -Force
          }
          Get-ChildItem -Path build -Recurse -Filter "llama.pdb" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $out -Force
          }

          # copy ggml-related artifacts (dlls/libs/pdbs)
          $ggmlPatterns = @("ggml*.dll","ggml-base*.dll","ggml-cuda*.dll","ggml*.lib","ggml-base*.lib","ggml*.pdb","ggml-base*.pdb")
          foreach ($pat in $ggmlPatterns) {
            Get-ChildItem -Path build -Recurse -Include $pat -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Copying $($_.FullName) -> $out"
              Copy-Item $_.FullName -Destination $out -Force
            }
          }

          Write-Host "=== Artifacts collected ==="
          Get-ChildItem -Path $out -Recurse | Select-Object FullName, Length | ForEach-Object { Write-Host $_.FullName }


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda121
          path: artifact_llama_windows/**
