name: Build llama.cpp (CUDA)

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    name: Build (Windows, CUDA 12.1, MSVC v142)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup venv + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip cmake ninja

      # Keep v142 (14.29) for compatibility if you need older toolset
      - name: MSVC dev env (v142 / 14.29)
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.29.30133

      - name: Setup CUDA 12.1 (network)
        uses: Jimver/cuda-toolkit@v0.2.29
        id: cuda
        with:
          cuda: '12.1.1'
          method: 'network'

      - name: Add CUDA to PATH + verify
        shell: pwsh
        run: |
          "$('${{ steps.cuda.outputs.CUDA_PATH }}')\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe" --version

      - name: Configure (cmake) and build llama.dll (Release)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Ninja"
          CUDACXX: "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe"
          CMAKE_CUDA_COMPILER: "${{ steps.cuda.outputs.CUDA_PATH }}\\bin\\nvcc.exe"
          CMAKE_CUDA_HOST_COMPILER: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.29.30133/bin/Hostx64/x64/cl.exe"
          CUDA_PATH: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          set -x

          # 1) Find CMakeLists.txt in repository (search recursively)
          $cmakeFile = Get-ChildItem -Path . -Recurse -Filter CMakeLists.txt -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cmakeFile) {
            Write-Error "CMakeLists.txt not found in repository. Make sure llama.cpp (or your source) is checked out here."
            exit 1
          }

          $sourceDir = $cmakeFile.Directory.FullName
          Write-Host "Using source directory for CMake: $sourceDir"

          # 2) Prepare build dir (we'll configure with -S <source> -B . to be explicit)
          if (-Not (Test-Path -Path build)) { New-Item -ItemType Directory -Path build | Out-Null }
          Push-Location build

          # 3) Configure with cmake (explicit -S and -B). Use Ninja and enable CUDA + shared lib
          $cmakeArgs = @(
            "-G", "Ninja",
            "-S", $sourceDir,
            "-B", ".",
            "-DLLAMA_BUILD_SHARED_LIBS=ON",
            "-DLLAMA_CUDA=ON",
            "-DCMAKE_BUILD_TYPE=Release"
          )
          # pass CUDA compiler env to cmake if available
          if ($env:CMAKE_CUDA_COMPILER) {
            $cmakeArgs += ("-DCMAKE_CUDA_COMPILER=$env:CMAKE_CUDA_COMPILER")
          }
          Write-Host "Running cmake with arguments: $($cmakeArgs -join ' ')"
          cmake @cmakeArgs

          # 4) Build
          $nproc = $env:NUMBER_OF_PROCESSORS
          if (-not $nproc) { $nproc = 2 }
          Write-Host "Building with $nproc parallel jobs"
          cmake --build . --config Release -- -j $nproc

          # 5) Inspect output (PowerShell friendly)
          Write-Host "=== Build tree (recursively from build) ==="
          Get-ChildItem -Path . -Recurse | Select-Object FullName, Length | ForEach-Object { Write-Host $_.FullName }

          Pop-Location

      - name: Collect artifacts (Windows)
        shell: pwsh
        run: |
          # Find produced DLL / import lib
          $dll = Get-ChildItem -Path build -Recurse -Filter "llama.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $so = Get-ChildItem -Path build -Recurse -Filter "libllama.so" -ErrorAction SilentlyContinue | Select-Object -First 1
          $lib = Get-ChildItem -Path build -Recurse -Filter "llama.lib" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($dll) { Write-Host "DLL found: $($dll.FullName)"; Copy-Item $dll.FullName -Destination ./artifact_llama_windows/ -Force }
          if ($lib) { Copy-Item $lib.FullName -Destination ./artifact_llama_windows/ -Force }

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda121
          path: artifact_llama_windows/**
