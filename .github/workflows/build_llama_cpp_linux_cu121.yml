name: Build llama.cpp (manylinux2014 + CUDA)

# Manual trigger
on:
  workflow_dispatch:

jobs:
  build-manylinux-cuda:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create manylinux+CUDA Dockerfile
        run: |
          cat > Dockerfile.manylinux_cuda <<'EOF'
          # manylinux2014_x86_64 base (CentOS7-based policy image)
          FROM quay.io/pypa/manylinux2014_x86_64:latest

          # Install packages used to install CUDA and for building
          # manylinux image uses yum (CentOS7)
          RUN yum -y update && \
              yum -y install epel-release && \
              yum -y install wget tar gzip bzip2 gcc gcc-c++ make cmake automake autoconf libtool \
                             python3 python3-devel python3-pip which && \
              yum clean all

          # --- Install CUDA Toolkit 12.1.x (toolkit + nvcc) ---
          # NOTE: We use the NVIDIA runfile installer to keep this self-contained.
          # You can change CUDA_VERSION to another exact 12.1.x if required.

          ENV CUDA_VERSION=12.1.1
          ENV CUDA_RUNFILE_URL=https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/cuda_${CUDA_VERSION}_linux.run

          # Download and install (silent). This may be slow.
          RUN set -ex \
              && cd /tmp \
              && wget -q --tries=5 "${CUDA_RUNFILE_URL}" -O cuda.run \
              && chmod +x cuda.run \
              # install only toolkit and driver components that don't require GPUs; accept license
              && sh cuda.run --silent --toolkit --override --installpath=/opt/cuda-${CUDA_VERSION} \
              && rm -f cuda.run

          # Symlink a stable path
          RUN ln -sfn /opt/cuda-${CUDA_VERSION} /opt/cuda

          # Put nvcc and libs on PATH / LD_LIBRARY_PATH
          ENV PATH=/opt/cuda/bin:$PATH
          ENV LD_LIBRARY_PATH=/opt/cuda/lib64:$LD_LIBRARY_PATH
          ENV CUDA_HOME=/opt/cuda

          # OPTIONAL: reduce dynamic deps by linking libstdc++/libgcc statically during build by using flags later

          # Create build user and set workspace
          RUN useradd -m builder
          USER builder
          WORKDIR /home/builder/work

          EOF

      - name: Build Docker image (manylinux + CUDA)
        run: |
          docker build -t manylinux2014-cuda:12.1 -f Dockerfile.manylinux_cuda .

      - name: Run container and build llama.cpp
        env:
          # Change these as needed (path to llama.cpp in your repo)
          LLAMA_ROOT: /work/src/llama.cpp
        run: |
          # copy repo into container and run build steps inside it
          # we mount the workspace into /work so outputs can be copied back
          docker run --rm -v "${{ github.workspace }}":/work -w /work manylinux2014-cuda:12.1 /bin/bash -lc "\
            set -ex ; \
            # ensure nvcc visible \
            /opt/cuda/bin/nvcc --version || true ; \
            # move into repo root (mounted) and create out dir \
            mkdir -p build && cd build ; \
            # Configure CMake: build shared libs, enable CUDA, and attempt to statically link libstdc++/libgcc
            cmake .. \
              -G Ninja \
              -DLLAMA_BUILD_SHARED_LIBS=ON \
              -DLLAMA_CUDA=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS='-static-libstdc++ -static-libgcc' \
              -DCMAKE_EXE_LINKER_FLAGS='-Wl,-Bsymbolic' ; \
            cmake --build . --config Release -j$(nproc) ; \
            # collect artifacts into /work/artifact (bound to host workspace) \
            mkdir -p /work/artifact_manylinux_cuda ; \
            find . -type f -name 'libllama*' -o -name 'llama*' | xargs -I{} cp --parents {} /work/artifact_manylinux_cuda/ || true ; \
            # also copy useful runtime files if present \
            cp -v /opt/cuda/lib64/*cudart* /work/artifact_manylinux_cuda/ 2>/dev/null || true ; \
            ls -la /work/artifact_manylinux_cuda ; \
          "

      - name: List artifacts produced
        run: ls -la artifact_manylinux_cuda || true

      - name: Archive and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-manylinux2014-cuda12.1
          path: artifact_manylinux_cuda/**

      - name: Cleanup image to save runner space
        run: docker image rm manylinux2014-cuda:12.1 || true
