name: Python LLaMa CPP Python CMake Vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup venv + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip wheel build setuptools scikit-build-core cmake ninja

      - name: MSVC dev env (v142 / 14.29)
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.29.30133

      # Install Vulkan SDK (network install)
      - name: Install Vulkan SDK (direct download)
        shell: pwsh
        run: |
          $VulkanVersion = "1.3.261.1"
          $VulkanUrl = "https://sdk.lunarg.com/sdk/download/$VulkanVersion/windows/VulkanSDK-$VulkanVersion-Installer.exe"
          $Installer = "$env:RUNNER_TEMP\VulkanSDK-$VulkanVersion-Installer.exe"
          Invoke-WebRequest -Uri $VulkanUrl -OutFile $Installer
          Start-Process -FilePath $Installer -ArgumentList "/S" -Wait
          # Add Vulkan bin to PATH
          $VulkanBin = "C:\VulkanSDK\$VulkanVersion\Bin"
          "$VulkanBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8


      - name: Build wheel (Vulkan, v142, Ninja)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Ninja"
          CMAKE_ARGS: "-DGGML_VULKAN=ON"
          FORCE_CMAKE: "1"
          # GLSLC executable for Vulkan shader compilation
          VULKAN_GLSLC_EXECUTABLE: "C:/Program Files/VulkanSDK/1.3.261.1/Bin/glslc.exe"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pip wheel llama-cpp-python==0.3.14 -w dist --verbose

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py310-vulkan
          path: dist/*.whl
