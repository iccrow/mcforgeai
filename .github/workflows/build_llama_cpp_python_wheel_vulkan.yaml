name: Python LLaMa CPP Python CMake Vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup venv + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip wheel build setuptools scikit-build-core cmake ninja

      - name: MSVC dev env (v142 / 14.29)
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.29.30133

      - name: Install Vulkan SDK
        # You may pin to the exact commit or the version.
        # uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff
        uses: humbletim/install-vulkan-sdk@v1.2
                
      - name: Build wheel (Vulkan, v142, Ninja)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Ninja"
          CMAKE_ARGS: "-DGGML_VULKAN=ON"
          FORCE_CMAKE: "1"
          VULKAN_SDK: "D:/a/mcforgeai/mcforgeai/VULKAN_SDK"
          Vulkan_INCLUDE_DIR: "D:/a/mcforgeai/mcforgeai/VULKAN_SDK/include"
          Vulkan_LIBRARY: "D:/a/mcforgeai/mcforgeai/VULKAN_SDK/lib/vulkan-1.lib"
          VULKAN_GLSLC_EXECUTABLE: "D:/a/mcforgeai/mcforgeai/VULKAN_SDK/bin/glslc.exe"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pip wheel llama-cpp-python==0.3.14 -w dist --verbose

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py310-vulkan
          path: dist/*.whl
