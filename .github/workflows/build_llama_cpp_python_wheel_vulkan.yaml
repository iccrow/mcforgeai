name: Python LLaMa CPP Python CMake Vulkan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup venv + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip wheel build setuptools scikit-build-core cmake ninja

      - name: MSVC dev env (v142 / 14.29)
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.29.30133

      - name: Install Vulkan SDK and Runtime
# You may pin to the exact commit or the version.
# uses: jakoch/install-vulkan-sdk-action@f49cea4f9cb2e449e2b3f1082251e9460dd9edc3
        uses: jakoch/install-vulkan-sdk-action@v1.2.8
    
                
      - name: Build wheel (Vulkan, v142, Ninja)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Ninja"
          CMAKE_ARGS: "-DGGML_VULKAN=ON"
          FORCE_CMAKE: "1"

        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pip wheel llama-cpp-python==0.3.14 -w dist --verbose

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py310-vulkan
          path: dist/*.whl
